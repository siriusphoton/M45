[project]
name = "m45"
version = "0.2.0"
description = "A personal assistant with continuity."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "discord-py>=2.7,<3",
    "langchain>=1.4,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2,<2",
    "langgraph-sdk>=0.4,<0.5",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "pyright[nodejs]>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project.scripts]
m45-discord = "m45.discord_bot:main"

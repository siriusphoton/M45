[project]
name = "m45"
version = "0.1.0"
description = "A personal assistant with continuity."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
# There is no application package to build or install at the scaffold stage.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
